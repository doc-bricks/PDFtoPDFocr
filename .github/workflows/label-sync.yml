name: Label Sync

on:
  push:
    branches: [master]
    paths:
      - '.github/labels.yml'
  workflow_dispatch:

concurrency:
  group: label-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
