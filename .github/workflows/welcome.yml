name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

concurrency:
  group: welcome-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Thank you for opening an issue on PDFtoPDFocr! We appreciate your feedback and will review it shortly.'
          pr-message: 'Thank you for your pull request! The team will inspect and review your contribution.'
