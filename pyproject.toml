[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PDFtoPDFocr"
version = "1.1.0"
description = "Local-first Windows desktop app converting scanned PDFs into searchable PDFs with Tesseract OCR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "doc-bricks" }
]
keywords = [
    "pdf-ocr",
    "searchable-pdf",
    "tesseract-ocr",
    "pyside6",
    "python3",
    "offline-first",
    "document-processing",
    "batch-ocr",
    "poppler",
    "windows-desktop"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.5.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pdf2image>=1.16.3",
    "pikepdf>=8.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/doc-bricks/PDFtoPDFocr"
Repository = "https://github.com/doc-bricks/PDFtoPDFocr.git"
Documentation = "https://github.com/doc-bricks/PDFtoPDFocr#readme"
"Bug Tracker" = "https://github.com/doc-bricks/PDFtoPDFocr/issues"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra -q"
