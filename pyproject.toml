[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PDFtoPDFocr"
version = "1.1.4"
description = "Local-first Windows desktop tool for converting scanned PDF files into searchable PDFs using Tesseract OCR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [
    { name = "doc-bricks Team", email = "support@lukasgeiger.com" }
]
keywords = ["pdf", "ocr", "tesseract", "searchable-pdf", "pyside6", "poppler", "desktop", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.5.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0",
    "pdf2image>=1.17.0",
    "pikepdf>=8.15.1",
    "requests>=2.33.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]
build = [
    "pyinstaller>=6.10.0",
    "altgraph>=0.17.4",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/doc-bricks/PDFtoPDFocr"
Repository = "https://github.com/doc-bricks/PDFtoPDFocr.git"
"Bug Tracker" = "https://github.com/doc-bricks/PDFtoPDFocr/issues"
Changelog = "https://github.com/doc-bricks/PDFtoPDFocr/blob/master/CHANGELOG.md"
"Third-Party Licenses" = "https://github.com/doc-bricks/PDFtoPDFocr/blob/master/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/doc-bricks/PDFtoPDFocr/blob/master/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/doc-bricks/PDFtoPDFocr/blob/master/llms.txt"

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".build_venv", ".git", ".pytest_cache", "__pycache__", "build", "dist", "releases", "store_package", "tesseract_portable", "tessdata", "_alt", "_WARTUNG"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E722", "E741", "F841"]

