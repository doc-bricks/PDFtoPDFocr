[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PDFtoPDFocr"
version = "1.1.3"
description = "Local-first Windows desktop tool for converting scanned PDF files into searchable PDFs using Tesseract OCR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "doc-bricks Team" }
]
keywords = ["pdf", "ocr", "tesseract", "searchable-pdf", "pyside6", "poppler", "desktop", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.5.0",
    "pytesseract>=0.3.10",
    "Pillow>=9.5.0",
    "pdf2image>=1.16.0",
    "pikepdf>=7.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/doc-bricks/PDFtoPDFocr"
Repository = "https://github.com/doc-bricks/PDFtoPDFocr.git"
"Bug Tracker" = "https://github.com/doc-bricks/PDFtoPDFocr/issues"
Changelog = "https://github.com/doc-bricks/PDFtoPDFocr/blob/master/CHANGELOG.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
